[package]
name = "risen-crowdfund"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban crowdfunding contract for the Risen Yellow Belt (Level 2) submission"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[features]
default = []
